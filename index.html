<!DOCTYPE html>
<html lang="uz" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#56633f" />
  <meta name="description" content="O'zbek tilida Sudoku — oson, o'rta, qiyin darajalar. Telefonda o'rnatib offline o'ynang." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sudoku" />
  <meta property="og:title" content="Sudoku — O'zbekcha" />
  <meta property="og:description" content="O'zbek tilida Sudoku. Oson, o'rta, qiyin. Offline PWA." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="./icons/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Sudoku — O'zbekcha</title>
  <script>
    // Anti-FOUC: apply saved theme before CSS loads. Brand chrome stays Garden sage.
    try {
      var s = JSON.parse(localStorage.getItem("sudoku-settings-v1") || "{}");
      var t = s.theme || "system";
      document.documentElement.dataset.theme = t;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", "#56633f");
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <h1>SUDO<span>KU</span></h1>
      <div class="top-actions">
        <div class="diff-row" role="tablist" aria-label="Qiyinlik darajasi">
          <button class="btn btn--sm diff active" data-diff="easy">Oson</button>
          <button class="btn btn--sm diff" data-diff="medium">O'rta</button>
          <button class="btn btn--sm diff" data-diff="hard">Qiyin</button>
        </div>
        <button id="btn-settings" class="icon-btn" aria-label="Sozlamalar" title="Sozlamalar"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="btn-install" class="btn btn--sm btn--primary install hidden" aria-label="O'rnatish" title="O'rnatish"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></button>
      </div>
    </header>

    <div class="status" aria-label="O'yin holati">
      <span class="stat stat--danger" id="mistakes"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg><b id="mistakes-val">0/10</b></span>
      <span class="stat" id="hints-left"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><b id="hints-val">3</b></span>
      <span class="stat" id="timer"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg><b id="timer-val">00:00</b></span>
      <span class="stat" id="best"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><b id="best-val">—</b></span>
    </div>

    <div class="board-holder">
      <div id="board" class="board" role="grid" aria-label="Sudoku taxtasi"></div>
      <div id="overlay" class="overlay hidden">
        <h2 id="overlay-title">Pauza</h2>
        <p id="overlay-sub"></p>
        <button id="overlay-btn" class="btn btn--primary btn--lg">Davom etish</button>
      </div>
    </div>

    <div class="sticky-bar">
      <div class="toolbar" aria-label="O'yin amallari">
        <button id="btn-new" class="btn btn--md btn--icon" aria-label="Yangi o'yin" title="Yangi"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button id="btn-erase" class="btn btn--md btn--icon" aria-label="O'chirish" title="O'chirish"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
        <button id="btn-notes" class="btn btn--md btn--icon" aria-pressed="false" aria-label="Qayd rejimi" title="Qayd"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
        <button id="btn-hint" class="btn btn--md btn--icon" aria-label="Ishora" title="Ishora"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></button>
        <button id="btn-pause" class="btn btn--md btn--icon" aria-label="Pauza" title="Pauza"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg></button>
      </div>
      <div id="numpad" class="numpad" aria-label="Raqamlar paneli"></div>
    </div>

    <div id="update-toast" class="update-toast hidden">
      <span>Yangi versiya chiqdi</span>
      <button id="btn-update">Yangilash</button>
    </div>

    <div id="ios-tip" class="ios-tip hidden">
      <span>iPhone: Share → <b>Home Screen ga qo'shish</b> ni bosing</span>
      <button id="ios-close" class="icon-btn" aria-label="Yopish"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
